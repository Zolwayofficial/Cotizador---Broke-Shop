<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador Perú Ultimate v3.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 5px;
    }
    .header p {
      color: #666;
      font-size: 14px;
    }
    .status {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
    .status.healthy {
      background: #4ade80;
      color: #155724;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .kpi-card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .kpi-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .kpi-card .variation {
      font-size: 14px;
      font-weight: bold;
    }
    .variation.up { color: #4ade80; }
    .variation.down { color: #ef4444; }
    .content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .content h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 15px;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 18px;
    }
    .error {
      background: #ef4444;
      color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Cotizador Perú Ultimate v3.0</h1>
      <p>Cotizador de Importación - Enterprise Grade</p>
      <div id="status" class="status">Cargando...</div>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="loading" class="loading">
      Cargando datos del servidor...
    </div>

    <div id="content" style="display: none;">
      <!-- KPIs -->
      <div class="kpi-grid" id="kpiGrid"></div>

      <!-- Dashboard Data -->
      <div class="content">
        <h2>📊 Datos del Dashboard</h2>
        <pre id="dashboardData"></pre>
      </div>

      <!-- Membresías -->
      <div class="content">
        <h2>👥 Estadísticas de Membresías</h2>
        <pre id="membresiasData"></pre>
      </div>

      <!-- Health -->
      <div class="content">
        <h2>💚 Salud del Sistema</h2>
        <pre id="healthData"></pre>
      </div>
    </div>
  </div>

    <script>
      const API_BASE = `${window.location.origin}/api`;

    async function fetchData(endpoint) {
      try {
        const response = await fetch(`${API_BASE}${endpoint}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        throw new Error(`${endpoint}: ${error.message}`);
      }
    }

    async function loadDashboard() {
      try {
        // Cargar health
        const health = await fetchData('/health');
        document.getElementById('status').className = 'status healthy';
        document.getElementById('status').textContent = '✅ SERVIDOR EN LÍNEA';
        document.getElementById('healthData').textContent = JSON.stringify(health, null, 2);

        // Cargar dashboard
        const dashboard = await fetchData('/dashboard');
        renderKPIs(dashboard.kpis);
        document.getElementById('dashboardData').textContent = JSON.stringify(dashboard, null, 2);

        // Cargar membresías
        const membresias = await fetchData('/membresias/estadisticas');
        document.getElementById('membresiasData').textContent = JSON.stringify(membresias, null, 2);

        // Mostrar contenido
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = `Error cargando datos: ${error.message}`;
        console.error('Error:', error);
      }
    }

    function renderKPIs(kpis) {
      const grid = document.getElementById('kpiGrid');
      grid.innerHTML = '';

      for (const [key, data] of Object.entries(kpis)) {
        const card = document.createElement('div');
        card.className = 'kpi-card';
        card.innerHTML = `
          <h3>${formatLabel(key)}</h3>
          <div class="value">${formatValue(data.valor)}</div>
          <div class="variation ${data.tendencia}">
            ${data.tendencia === 'up' ? '📈' : '📉'} ${data.variación}%
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function formatLabel(key) {
      const labels = {
        totalCotizaciones: 'Total Cotizaciones',
        totalDolares: 'Total Dólares',
        ticketPromedio: 'Ticket Promedio',
        paisesActivos: 'Países Activos'
      };
      return labels[key] || key;
    }

    function formatValue(value) {
      if (typeof value === 'number') {
        if (value >= 1000000) return `$${(value / 1000000).toFixed(1)}M`;
        if (value >= 1000) return `$${(value / 1000).toFixed(0)}K`;
        return value.toString();
      }
      return value;
    }

    // Cargar datos al iniciar
    loadDashboard();

    // Recargar cada 30 segundos
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
