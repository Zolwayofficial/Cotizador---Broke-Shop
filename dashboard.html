<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImportAIAgent Cotizador - Dashboard operativo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 5px;
    }
    .header p {
      color: #666;
      font-size: 14px;
    }
    .status {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
    .status.available {
      background: #dbeafe;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
    }
    .status.demo {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #f59e0b;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .kpi-card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .kpi-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .kpi-card .variation {
      font-size: 14px;
      font-weight: bold;
    }
    .variation.up { color: #4ade80; }
    .variation.down { color: #ef4444; }
    .variation.na { color: #666; }
    .content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    .content h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 15px;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 18px;
    }
    .error {
      background: #ef4444;
      color: white;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .notice {
      background: #fef3c7;
      color: #92400e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #f59e0b;
    }
    .kpi-empty {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ImportAIAgent Cotizador</h1>
      <p>Dashboard operativo local para salud, membresias y payload de KPIs.</p>
      <div id="status" class="status">Cargando...</div>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="loading" class="loading">
      Cargando datos del servidor...
    </div>

    <div id="content" style="display: none;">
      <div id="dashboardNotice" class="notice" style="display: none;"></div>
      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="content">
        <h2>Datos del dashboard</h2>
        <pre id="dashboardData"></pre>
      </div>

      <div class="content">
        <h2>Estadisticas de membresias</h2>
        <pre id="membresiasData"></pre>
      </div>

      <div class="content">
        <h2>Salud del sistema</h2>
        <pre id="healthData"></pre>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = `${window.location.origin}/api`;

    async function fetchData(endpoint) {
      try {
        const response = await fetch(`${API_BASE}${endpoint}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        throw new Error(`${endpoint}: ${error.message}`);
      }
    }

    async function loadDashboard() {
      try {
        const health = await fetchData('/health');
        document.getElementById('healthData').textContent = JSON.stringify(health, null, 2);

        const dashboard = await fetchData('/dashboard');
        renderStatus({ health, dashboard });
        renderDashboardNotice(dashboard);
        renderKPIs(dashboard);
        document.getElementById('dashboardData').textContent = JSON.stringify(dashboard, null, 2);

        const membresias = await fetchData('/membresias/estadisticas');
        document.getElementById('membresiasData').textContent = JSON.stringify(membresias, null, 2);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = `Error cargando datos: ${error.message}`;
        console.error('Error:', error);
      }
    }

    function renderStatus({ health, dashboard }) {
      const status = document.getElementById('status');
      const isDemo = health?.source === 'demo_local'
        || health?.status === 'demo_local'
        || dashboard?.source === 'demo_local';

      status.className = `status ${isDemo ? 'demo' : 'available'}`;
      status.textContent = isDemo ? 'DEMO LOCAL' : 'API RESPONDIENDO';
    }

    function renderDashboardNotice(dashboard) {
      const notice = document.getElementById('dashboardNotice');
      const noteText = dashboard?.nota || '';
      const isDemo = dashboard?.source === 'demo_local';

      if (!isDemo && !noteText) {
        notice.style.display = 'none';
        notice.textContent = '';
        return;
      }

      notice.style.display = 'block';
      notice.textContent = noteText || 'Dashboard local no conectado a datos reales.';
    }

    function renderKPIs(dashboard) {
      const kpis = dashboard?.kpis;
      const grid = document.getElementById('kpiGrid');
      grid.innerHTML = '';

      if (!Object.keys(kpis || {}).length) {
        const isDemo = dashboard?.source === 'demo_local';
        const card = document.createElement('div');
        card.className = 'kpi-card kpi-empty';
        card.innerHTML = `
          <h3>${isDemo ? 'Dashboard local' : 'Dashboard operativo'}</h3>
          <div class="value">${isDemo ? 'Sin KPIs reales' : 'Sin KPIs disponibles'}</div>
          <div class="variation na">
            ${isDemo
              ? 'Sin KPIs reales disponibles en este dashboard local.'
              : 'El dashboard no devolvio KPIs utilizables en esta carga.'}
          </div>
        `;
        grid.appendChild(card);
        return;
      }

      for (const [key, data] of Object.entries(kpis || {})) {
        const card = document.createElement('div');
        const variation = formatVariation(data);
        card.className = 'kpi-card';
        card.innerHTML = `
          <h3>${formatLabel(key)}</h3>
          <div class="value">${formatValue(key, data?.valor)}</div>
          <div class="${variation.className}">
            ${variation.text}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function formatLabel(key) {
      const labels = {
        totalCotizaciones: 'Total cotizaciones',
        totalDolares: 'Total dolares',
        ticketPromedio: 'Ticket promedio',
        paisesActivos: 'Paises activos',
      };
      return labels[key] || key;
    }

    function isCurrencyMetric(key) {
      return key === 'totalDolares' || key === 'ticketPromedio';
    }

    function formatValue(key, value) {
      if (value === null || value === undefined || value === '') {
        return 'N/D';
      }
      if (typeof value === 'number') {
        if (isCurrencyMetric(key)) {
          if (value >= 1000000) return `$${(value / 1000000).toFixed(1)}M`;
          if (value >= 1000) return `$${(value / 1000).toFixed(0)}K`;
        }
        return Number.isInteger(value) ? value.toString() : value.toFixed(2);
      }
      return value;
    }

    function formatVariation(metric) {
      const variation = Number(metric?.variacion);

      if (!Number.isFinite(variation)) {
        return {
          className: 'variation na',
          text: 'No disponible',
        };
      }

      if (variation === 0) {
        return {
          className: 'variation na',
          text: 'Sin variacion',
        };
      }

      const direction = metric?.tendencia === 'down' || variation < 0 ? 'down' : 'up';
      const symbol = variation > 0 ? '+' : '-';

      return {
        className: `variation ${direction}`,
        text: `${symbol} ${Math.abs(variation)}%`,
      };
    }

    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
