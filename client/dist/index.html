<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Broke Shop — Cotizador de Importación</title>
  <meta name="description" content="Cotiza importaciones al Perú con IA. Broke Shop - 8,017 partidas SUNAT, permisos, TLCs, antidumping, duda razonable.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='20' width='60' height='60' rx='8' stroke='%23F7931E' stroke-width='6' fill='none'/><path d='M35 70L70 35' stroke='%23F7931E' stroke-width='6' stroke-linecap='round'/><path d='M50 35H70V55' stroke='%23F7931E' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <meta name="theme-color" content="#F7931E">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin:0; padding:0; overflow:hidden; background:#0a0a0a; }
    #splash { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0a0a0a; gap:16px; }
    #splash .dots { display:flex; gap:6px; }
    #splash .dot { width:8px; height:8px; border-radius:50%; background:#F7931E; animation:p 1.2s ease-in-out infinite; }
    #splash .dot:nth-child(2) { animation-delay:0.2s; }
    #splash .dot:nth-child(3) { animation-delay:0.4s; }
    @keyframes p { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }
  </style>
</head>
<body>
  <div id="root">
    <div id="splash">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="8" width="30" height="30" rx="4" stroke="#F7931E" stroke-width="3"/>
        <path d="M16 32L32 16" stroke="#F7931E" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 16H32V26" stroke="#F7931E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  </div>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
